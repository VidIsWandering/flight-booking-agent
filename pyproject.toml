[project]
name = "flight-booking-agent"
version = "0.1.0"
description = "A harness-engineered flight booking agent built with LangChain and LangGraph, comparing ReAct, Plan-then-Execute and a hybrid planner."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nguyen Quoc Bao" }]
requires-python = ">=3.10"
keywords = ["agents", "langchain", "langgraph", "react", "plan-and-execute", "harness", "evaluation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "google-genai>=2.25",
    "httpx>=0.27",
    "langchain>=1.0,<2",
    "langchain-google-genai>=4.4,<5",
    "langgraph>=1.0,<2",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/VidIsWandering/flight-booking-agent"
Repository = "https://github.com/VidIsWandering/flight-booking-agent"
Documentation = "https://github.com/VidIsWandering/flight-booking-agent/tree/main/docs"

[project.scripts]
flight-agent = "flight_agent.cli:main"

[dependency-groups]
figures = ["matplotlib>=3.8"]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.coverage.run]
source = ["flight_agent"]
branch = true

[tool.coverage.report]
show_missing = false
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["flight_agent"]
known-local-folder = ["fakes"]
